# Build the API image on every PR (proves the Dockerfile still builds), push it to GHCR on main.
#
# Tags: the full commit sha, which is what the GitOps overlays pin (an immutable tag, so Argo
# CD's desired state names exactly one image), plus `main` for humans. No `latest`.

name: image

on:
  push:
    branches: [main]
  pull_request:
    paths: [Dockerfile, .dockerignore, pyproject.toml, "src/**", "bench/**", "eval/**"]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name (registry paths must be lowercase; the owner is not)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/financevault" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
