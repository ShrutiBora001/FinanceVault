[project]
name = "financevault"
version = "0.1.0"
description = "A point-in-time-correct financial tool-use environment with step-level verification"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "anthropic>=0.40",
    "duckdb>=1.1",
    "redis>=5.0",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "orjson>=3.10",
    "rich>=13.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "lxml>=5.2",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Embeddings run locally on CPU; this pulls torch, so it is kept separate.
embed = ["sentence-transformers>=3.0"]
# Only needed for the LoRA smoke run on MVP1 day 13.
train = ["transformers>=4.44", "peft>=0.12", "datasets>=2.20", "accelerate>=0.33", "trl>=0.10"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
financevault = ["store/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
