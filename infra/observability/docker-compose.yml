name: financevault-obs

# Local observability stack for the API running on the host (`make serve`).
#   traces:  API --OTLP/http :54318--> collector --OTLP/grpc--> Tempo
#   metrics: Prometheus scrapes host.docker.internal:8000/metrics
#   UI:      Grafana on :53000 (anonymous admin, local only), dashboard provisioned from
#            monitoring/dashboards/.
# Host ports are in the 5xxxx range like infra/docker-compose.yml; the usual ones are taken.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["54318:4318"]
    depends_on: [tempo]

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    # Root so the local trace volume is writable; the image's default uid cannot create it.
    user: "0"
    volumes: ["./tempo.yaml:/etc/tempo.yaml:ro", "tempo:/var/tempo"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["59090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana:/etc/grafana/provisioning:ro
      - ../../monitoring/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["53000:3000"]
    depends_on: [prometheus, tempo]

volumes:
  tempo:
